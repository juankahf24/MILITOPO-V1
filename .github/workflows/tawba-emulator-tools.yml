name: Tawba Emulator Tools

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tawba-emulator-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install Android system image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;default;x86_64"
      - name: Package runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/sdk/system-images/android-35/default
          cp -a "$ANDROID_SDK_ROOT/emulator" out/sdk/
          cp -a "$ANDROID_SDK_ROOT/platform-tools" out/sdk/
          cp -a "$ANDROID_SDK_ROOT/system-images/android-35/default/x86_64" out/sdk/system-images/android-35/default/
          tar --zstd -cf out/android-emulator-api35.tar.zst -C out sdk
          rm -rf out/sdk
          sha256sum out/android-emulator-api35.tar.zst > out/SHA256SUMS.txt
          ls -lh out/
      - name: Upload emulator runtime
        uses: actions/upload-artifact@v4
        with:
          name: tawba-emulator-api35
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
