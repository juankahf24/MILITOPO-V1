name: Temporary bundletool artifact

on:
  pull_request:
    paths:
      - '.github/workflows/temp-bundletool-artifact.yml'
  workflow_dispatch:

jobs:
  bundletool:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download official bundletool 1.18.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output bundletool-all-1.18.3.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          test -s bundletool-all-1.18.3.jar
          sha256sum bundletool-all-1.18.3.jar > bundletool-all-1.18.3.jar.sha256
      - name: Upload bundletool
        uses: actions/upload-artifact@v4
        with:
          name: bundletool-1.18.3
          path: |
            bundletool-all-1.18.3.jar
            bundletool-all-1.18.3.jar.sha256
          if-no-files-found: error
          retention-days: 1
