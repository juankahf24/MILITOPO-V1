name: Muslim QI Design APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'muslim-qi-design/**'
      - '.github/workflows/muslim-qi-design-apk.yml'

permissions:
  contents: read

jobs:
  build-design-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile, lint and package
        working-directory: muslim-qi-design
        run: gradle --no-daemon --stacktrace clean lintDebug assembleDebug

      - name: Verify APK structure
        run: |
          test -f muslim-qi-design/app/build/outputs/apk/debug/app-debug.apk
          unzip -t muslim-qi-design/app/build/outputs/apk/debug/app-debug.apk
          ls -lh muslim-qi-design/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r muslim-qi-design/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.muslimqi.design.demo
            adb shell am start -W -n com.muslimqi.design.demo/com.muslimqi.design.MainActivity
            sleep 5
            APP_PID="$(adb shell pidof com.muslimqi.design.demo | tr -d '\r')"
            test -n "$APP_PID"
            adb shell dumpsys activity activities | grep -q 'com.muslimqi.design.demo/com.muslimqi.design.MainActivity'
            adb exec-out screencap -p > muslim-qi-launch.png
            test -s muslim-qi-launch.png

      - name: Upload verified APK and launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-QI-Modern-Design-APK
          path: |
            muslim-qi-design/app/build/outputs/apk/debug/app-debug.apk
            muslim-qi-launch.png
          if-no-files-found: error
          retention-days: 1
